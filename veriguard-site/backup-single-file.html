<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>VeriGuard · Mobile Prototype</title>
<style>
:root{--ink:#0c2457;--mut:#52668f;--pri:#1f63d8;--ln:#d9e6fb;--top:52px;box-sizing:border-box}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{height:100%;margin:0}
body{background:#cfdcf2;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",Inter,Arial,sans-serif;color:var(--ink);display:grid;place-items:center}
@media(prefers-color-scheme:dark){body{background:#0b1220}}
#dev{position:relative;width:390px;height:min(844px,97vh);border-radius:44px;overflow:hidden;box-shadow:0 40px 100px #1b3a7a55,0 0 0 10px #101828;display:flex;flex-direction:column;background:radial-gradient(90% 16% at 12% 100%,#bcd4ff 0 70%,#0000 71%),radial-gradient(80% 13% at 88% 102%,#c7dcff 0 70%,#0000 71%),linear-gradient(180deg,#f4f8ff,#dce9ff)}
#isl{position:absolute;top:10px;left:50%;transform:translateX(-50%);width:120px;height:34px;border-radius:20px;background:#05080f;z-index:20;pointer-events:none}
@media(max-width:480px){#dev{width:100%;height:100%;border-radius:0;box-shadow:none}#isl{display:none}:root{--top:max(50px,calc(env(safe-area-inset-top,0px) + 8px))}}
#scr{flex:1;position:relative;overflow:hidden}
.s{position:absolute;inset:0;display:flex;flex-direction:column;overflow-y:auto;animation:in .25s}@keyframes in{from{opacity:0;transform:translateX(14px)}}
.pad{padding:0 22px}.hd{display:flex;align-items:center;justify-content:space-between;padding:var(--top) 16px 8px}.hd h2{margin:0;font-size:20px;font-weight:800}
.ib{width:38px;height:38px;border:0;background:none;color:var(--ink);display:grid;place-items:center;cursor:pointer;padding:0;position:relative}
.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.c{background:#ffffffcc;border:1px solid #e1ecff;border-radius:18px;box-shadow:0 8px 24px #3a74d422;padding:14px}
.row{display:flex;gap:12px;align-items:center;cursor:pointer}.row.nc{cursor:default}.row>div{flex:1;min-width:0}.row>.ic{flex:none}.c>.row:last-child{border-bottom:0!important}.row b{display:block;font-size:15px}.row small{color:var(--mut);font-size:12.5px;line-height:1.3;display:block}
.ic{width:44px;height:44px;border-radius:14px;background:#eaf2ff;display:grid;place-items:center;color:var(--pri);flex:none}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;height:50px;border:0;border-radius:26px;background:linear-gradient(180deg,#3a86f5,#1b57cf);color:#fff;font-weight:700;font-size:17px;font-family:inherit;box-shadow:0 8px 18px #1f63d855;cursor:pointer;margin-top:14px}.btn.o{background:#ffffff99;color:var(--pri);border:1.5px solid #6fa0ec;box-shadow:none}.btn:disabled{opacity:.45}.btn.d{background:linear-gradient(180deg,#e5586a,#c62f3f)}
.lk{background:none;border:0;color:var(--pri);font-weight:600;font-size:13px;font-family:inherit;cursor:pointer;padding:4px}
.fd{display:flex;align-items:center;gap:10px;background:#ffffffd0;border:1px solid #d3e2fb;border-radius:14px;padding:0 14px;height:48px;margin-top:12px;color:var(--mut)}.fd input{flex:1;border:0;background:none;outline:0;font-size:15px;font-family:inherit;color:var(--ink);min-width:0}
.err{color:#c62f3f;font-size:12px;margin:4px 6px 0}.ok{color:#1a8a50;font-size:13px;background:#dff6e8;border-radius:12px;padding:10px 12px;margin-top:12px}
nav{margin-top:auto;flex:none;display:flex;justify-content:space-around;padding:8px 8px calc(12px + env(safe-area-inset-bottom,0px));background:#ffffffe6;border-top:1px solid #e1ecff;border-radius:22px 22px 0 0;position:sticky;bottom:0}
nav button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;font-weight:500;font-size:11px;font-family:inherit;color:#6a7fa6;cursor:pointer;flex:1}nav .on{color:var(--pri);font-weight:800}
.wm{font-weight:900;letter-spacing:-.04em;text-align:center;line-height:1}.wm b{color:#1f63d8}
.mid{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:0 28px}
.mid p{color:var(--mut);margin:8px 0;line-height:1.45}
.dots{display:flex;gap:7px;justify-content:center;margin:14px 0}.dots i{width:8px;height:8px;border-radius:5px;background:#b9cdf0}.dots i.on{width:24px;background:var(--pri)}
.big{width:150px;height:150px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,#cfe0ff);display:grid;place-items:center;color:var(--pri);box-shadow:0 18px 40px #2d6fe033}.big .i{width:72px;height:72px;stroke-width:1.6}
.hero{background:linear-gradient(135deg,#4a96ff,#1b57cf);color:#fff;border-radius:22px;padding:18px;display:flex;align-items:center;gap:10px;cursor:pointer;box-shadow:0 12px 26px #1f63d855}.hero b{font-size:22px;display:block}.hero small{font-size:13.5px;opacity:.92;line-height:1.3}
.go{width:42px;height:42px;border-radius:50%;background:#ffffff40;display:grid;place-items:center;flex:none}
.qa{display:grid;grid-template-columns:1fr 1fr;gap:12px}.qa button{background:#ffffffd0;border:1px solid #e1ecff;border-radius:16px;padding:14px 6px;font-weight:600;font-size:13px;font-family:inherit;color:var(--ink);display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer;box-shadow:0 6px 16px #3a74d41c}.qa .i{color:var(--pri);width:26px;height:26px}
.tabs{display:flex;background:#e3edff;border-radius:20px;padding:3px;margin:6px 0 10px}.tabs button{flex:1;border:0;background:none;border-radius:17px;padding:8px;font-weight:600;font-size:13px;font-family:inherit;color:var(--ink);cursor:pointer}.tabs .on{background:var(--pri);color:#fff}
.bd{font-size:11.5px;font-weight:700;border-radius:10px;padding:4px 10px;white-space:nowrap}.g{background:#d8f3e3;color:#17894f}.a{background:#fff0c4;color:#a87100}.o{background:#ffe2cd;color:#c85a14}.r{background:#fdd9dd;color:#c62f3f}
.pn{border-radius:20px;text-align:center;padding:22px 18px}.pn.g{background:#d8f3e3}.pn.a{background:#fff0c4}.pn.o{background:#ffe2cd}.pn.r{background:#fcd5da}.pn h3{margin:8px 0 4px;font-size:26px}.pn p{margin:0;font-size:14.5px}.pn .i{width:56px;height:56px}
.pn.g h3,.pn.g .i{color:#17894f}.pn.a h3,.pn.a .i{color:#a87100}.pn.o h3,.pn.o .i{color:#c85a14}.pn.r h3,.pn.r .i{color:#c62f3f}
.ck{display:flex;gap:10px;align-items:center;padding:7px 0;font-size:14px}.ck .t{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;color:#fff;flex:none}.t .i{width:13px;height:13px;stroke-width:3}.t.rr{background:#e5586a}.t.gg{background:#2fae6c}
.sw{width:50px;height:30px;border-radius:15px;background:#c3d3ee;position:relative;border:0;cursor:pointer;flex:none}.sw::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:.2s}.sw.on{background:var(--pri)}.sw.on::after{left:23px}
.ring{width:150px;height:150px;border-radius:50%;border:8px solid #d6e5fb;border-top-color:var(--pri);animation:sp 1.1s linear infinite;position:absolute}@keyframes sp{to{transform:rotate(360deg)}}
.vf{width:230px;height:230px;border-radius:26px;background:#0b1b3acc;position:relative;overflow:hidden;margin:18px auto}.vf i{position:absolute;width:40px;height:40px;border:4px solid #7db3ff}.vf i:nth-child(1){top:14px;left:14px;border-right:0;border-bottom:0;border-radius:12px 0 0 0}.vf i:nth-child(2){top:14px;right:14px;border-left:0;border-bottom:0;border-radius:0 12px 0 0}.vf i:nth-child(3){bottom:14px;left:14px;border-right:0;border-top:0;border-radius:0 0 0 12px}.vf i:nth-child(4){bottom:14px;right:14px;border-left:0;border-top:0;border-radius:0 0 12px 0}
.vf u{position:absolute;left:18px;right:18px;height:3px;background:#5fb0ff;box-shadow:0 0 14px #5fb0ff;animation:sc 2s ease-in-out infinite alternate}@keyframes sc{from{top:24px}to{top:200px}}
.drop{border:2px dashed #8fb3ee;border-radius:20px;background:#ffffffa0;padding:30px 16px;text-align:center;color:var(--mut);cursor:pointer;display:block}.drop .i{width:42px;height:42px;color:var(--pri)}
.cmp{display:grid;grid-template-columns:1.1fr 1fr 1fr 24px;gap:6px;font-size:12px;padding:9px 0;border-top:1px solid var(--ln);align-items:center}.cmp:first-child{border:0;font-weight:700;color:var(--mut)}
#sheet{position:absolute;inset:0;background:#0a1a3c66;display:none;align-items:flex-end;z-index:9}#sheet.on{display:flex}.sh{background:#fff;width:100%;max-height:80%;overflow-y:auto;border-radius:26px 26px 0 0;padding:18px 20px 26px}.sh h3{margin:0 0 10px}
#toast{position:absolute;left:50%;bottom:90px;transform:translateX(-50%);background:#0c2457ee;color:#fff;padding:10px 16px;border-radius:20px;font-size:13px;z-index:10;opacity:0;transition:.25s;pointer-events:none;max-width:86%;text-align:center}#toast.on{opacity:1}
.bg{position:absolute;top:6px;right:6px;width:9px;height:9px;border-radius:50%;background:#e5586a}
</style></head><body>

login:()=>`<div class="pad" style="padding-top:var(--top);text-align:center"><img src="${LOGO}" width="120" alt="">${wm(36)}<p style="margin:6px 0 4px">Scan. Verify. Stay Safe.</p></div><div class="pad">${fd('em','mail','Email Address','email')}${fd('pw','lock','Password','password','',1)}<div style="display:flex;justify-content:space-between;align-items:center;margin-top:8px;font-size:12.5px"><label><input type="checkbox" id="rm" checked> Remember me</label><button class="lk" data-go="forgot">Forgot Password?</button></div><button class="btn" data-act="login">Log In</button><p style="text-align:center;color:var(--mut);margin:8px 0 0">or</p><button class="btn o" style="margin-top:8px" data-go="signup">Create Account</button></div>`,
signup:()=>`${hdr('',1)}<div class="pad"><h1 style="margin:0;font-size:26px">Create Account</h1><p style="color:var(--mut);margin:4px 0 6px">Join VeriGuard and stay protected.</p>${fd('fn','user','Full Name')}${fd('em','mail','Email Address','email')}${fd('pw','lock','Password','password','',1)}${fd('pw2','lock','Confirm Password','password','',1)}<button class="btn" data-act="signup" style="margin-top:20px">Create Account</button><p style="text-align:center;font-size:13px;color:var(--mut)">Already have an account? <button class="lk" data-root="login">Log In</button></p></div>`,
forgot:()=>`${hdr('Forgot Password',1)}<div class="pad"><p style="color:var(--mut)">Enter your registered email and we’ll send a reset link.</p>${fd('em','mail','Email Address','email')}<div id="fm"></div><button class="btn" data-act="forgot">Send Reset Link</button></div>`,
dash:()=>`<div class="hd" style="padding-bottom:0"><button class="ib" data-act="menu">${I('menu')}</button><span></span><button class="ib" data-act="notifs">${I('bell')}${S.notif?'<i class="bg"></i>':''}</button></div><div class="pad" style="display:flex;justify-content:space-between;align-items:center"><h1 style="font-size:30px;margin:0;line-height:1.1">Hello,<br>${esc(nm())}!</h1><img src="${LOGO}" width="120" alt=""></div><div class="pad" style="margin-top:12px"><div class="hero" data-go="type"><div style="flex:1"><b>Scan &amp; Verify</b><small>Check links, QR codes, and content for threats.</small></div><div class="go">${I('right')}</div></div><h3 style="margin:20px 0 10px">Quick Actions</h3><div class="qa"><button data-go="url">${I('link')}Scan URL</button><button data-go="qr">${I('qr')}Scan QR</button><button data-go="file">${I('upload')}Upload File</button><button data-root="kc">${I('book')}Knowledge Center</button></div></div>${nav('dash')}`,
type:()=>`${hdr('',1)}<div class="pad"><h1 style="margin:0;font-size:26px">Choose Scan Type</h1><p style="color:var(--mut);margin:4px 0 12px">Select what you want to analyze.</p>${[['link','URL Scan','Check a website link for threats.','url'],['qr','QR Scan','Scan a QR code for safety.','qr'],['file','File Scan','Upload a file or screenshot to analyze.','file']].map(([i,t,d,r])=>`<div class="c row" style="margin-bottom:12px" data-go="${r}"><div class="ic">${I(i)}</div><div><b>${t}</b><small>${d}</small></div>${I('chev')}</div>`).join('')}</div>`,
url:()=>`${hdr('',1)}<div class="pad"><h1 style="margin:0;font-size:26px">Enter Website Link</h1><p style="color:var(--mut);margin:4px 0 6px">Paste the link you want to check.</p>${fd('u','link','https://example.com','url')}<button class="btn" data-act="scanurl">Scan</button><div class="c row" style="margin-top:18px" data-act="ex"><div><b>Try an example</b><small style="color:var(--pri);font-size:14px">https://bit.ly/sample</small></div>${I('ext')}</div></div>`,
file:()=>`${hdr('Upload File',1)}<div class="pad"><p style="color:var(--mut);margin-top:0">Upload a screenshot, image or document that contains suspicious content.</p><label class="drop">${I('upload')}<br><b id="fn" style="color:var(--ink)">Tap to choose a file</b><br><small>PNG, JPG, PDF, DOCX</small><input id="ff" type="file" accept="image/*,.pdf,.doc,.docx" hidden></label><button class="btn" id="fs" data-act="scanfile" disabled>Scan File</button><button class="btn o" data-act="samplefile">Use a sample suspicious screenshot</button></div>`,
qr:()=>`${hdr('Scan QR Code',1)}<div class="pad" style="text-align:center"><p style="color:var(--mut);margin:0">Point the camera at a QR code. VeriGuard checks where it leads before you open it.</p><div class="vf"><i></i><i></i><i></i><i></i><u></u></div><button class="btn" data-act="simqr">Simulate a QR scan</button><label class="btn o" style="display:grid;place-items:center;cursor:pointer;margin-top:10px">Upload QR image<input id="qf" type="file" accept="image/*" hidden></label><small style="color:var(--mut);display:block;margin-top:10px">Prototype: live camera decoding is not connected.</small></div>`,
ana:()=>{const st=['Inspecting link…','Analyzing content…','Checking for known threats…'];return`<div class="pad" style="padding-top:var(--top)"></div><div class="mid"><div style="position:relative;width:150px;height:150px;display:grid;place-items:center"><div class="ring"></div><img src="${LOGO}" width="90" alt=""></div><h1 style="margin:22px 0 0">Analyzing…</h1><p>Checking the content for potential threats.</p></div><div class="pad" style="padding-bottom:26px"><div class="c">${st.map((t,i)=>`<div class="ck" id="st${i}"><span class="t gg" style="background:#c3d3ee">${I('check')}</span>${t}</div>`).join('')}</div><button class="btn o" data-back>Cancel</button></div>`},
res:()=>{const s=S.scan,L=LV[s.lvl],good=s.lvl=='low';return`${hdr('Scan Result',1)}<div class="pad"><div class="pn ${L.c}">${I(L.i)}<h3>${L.t}</h3><p>${L.d}</p></div><div class="c" style="margin-top:14px"><b>${good?'Summary':'Threat Summary'}</b>${(s.ind.length?s.ind:['No phishing indicators detected','Address looks consistent','No known threat patterns matched']).map(x=>`<div class="ck"><span class="t ${s.ind.length?'rr':'gg'}">${I(s.ind.length?'x':'check')}</span>${x}</div>`).join('')}</div><button class="btn" data-go="fnd" data-a="ov">View Details</button><button class="btn o" data-go="act">Recommended Actions</button><p style="font-size:11.5px;color:var(--mut);text-align:center;margin:12px 0">Demo assessment from simple pattern checks. It’s not a guarantee of safety.</p></div>`},
fnd:t=>{const s=S.scan,L=LV[s.lvl],th=s.lvl=='low'?'None detected':/Phishing/.test(s.ind.join())?'Phishing':'Suspicious content';return`${hdr('Detailed Findings',1)}<div class="pad"><div class="tabs"><button class="${t=='ov'?'on':''}" data-go="fnd" data-a="ov">Overview</button><button class="${t=='ct'?'on':''}" data-go="fnd" data-a="ct">Content</button><button data-go="cmp">Comparison</button></div>${t=='ov'?[['globe','URL',esc(s.val)],['shield','Threat Type',th],['bars','Risk Level',`<span class="bd ${L.c}">${L.t}</span>`],['clock','Detection Basis',s.lvl=='low'?'No known phishing indicators or suspicious content found.':'Matches known phishing indicators and suspicious content.']].map(([i,a,b])=>`<div class="c row nc" style="margin-bottom:10px"><div class="ic">${I(i)}</div><div><b>${a}</b><small style="color:var(--ink);font-size:13.5px;word-break:break-all">${b}</small></div></div>`).join(''):`<div class="c"><b>Submitted content</b><small>${s.type}: ${esc(s.val)}</small></div><div class="c" style="margin-top:10px"><b>Indicators found</b>${(s.ind.length?s.ind:['None']).map(x=>`<div class="ck">• ${x}</div>`).join('')}</div><div class="c" style="margin-top:10px"><b>Checks performed</b>${['Link inspection','Content analysis','Known threat lookup'].map(x=>`<div class="ck"><span class="t gg">${I('check')}</span>${x}</div>`).join('')}</div>`}<button class="btn" data-go="act">Recommended Actions</button></div>`},
cmp:()=>{const s=S.scan,h=host(s.val),L=s.lvl,bad=[L!='low'&&L!='caution',/^http:/i.test(s.val),L=='susp'||L=='high',L=='high'];const R=[['Domain',h,'Official brand domain'],['Connection',/^http:/i.test(s.val)?'HTTP':'HTTPS','HTTPS'],['Wording',bad[2]?'Urgent / reward':'Neutral','Neutral'],['Login request',bad[3]?'Asks for sign-in':'None','Only on official site']];return`${hdr('Content Comparison',1)}<div class="pad"><div class="tabs"><button data-go="fnd" data-a="ov">Overview</button><button data-go="fnd" data-a="ct">Content</button><button class="on">Comparison</button></div><p style="color:var(--mut);margin:0 0 8px;font-size:13px">Submitted content next to legitimate reference information.</p><div class="c"><div class="cmp"><span></span><span>Submitted</span><span>Legitimate</span><span></span></div>${R.map(([a,b,c],i)=>`<div class="cmp"><b>${a}</b><span style="word-break:break-all">${esc(b)}</span><span>${c}</span><span class="t ${bad[i]?'rr':'gg'}" style="width:20px;height:20px;border-radius:50%;display:grid;place-items:center;color:#fff;background:${bad[i]?'#e5586a':'#2fae6c'}">${I(bad[i]?'x':'check')}</span></div>`).join('')}</div><button class="btn" data-go="act">Recommended Actions</button></div>`},
act:()=>{const s=S.scan;return`${hdr('Recommended Actions',1)}<div class="pad"><p style="color:var(--mut);margin-top:0">Follow these steps for this ${LV[s.lvl].t.toLowerCase()} result.</p>${ACT[s.lvl].map((x,i)=>`<div class="c row" style="margin-bottom:10px" data-act="tick"><span class="t gg" style="width:24px;height:24px;border-radius:50%;background:#c3d3ee;color:#fff;display:grid;place-items:center;flex:none">${I('check','')}</span><div><b style="font-size:14px;font-weight:600">${x}</b></div></div>`).join('')}<button class="btn" data-root="hist">Go to Scan History</button><button class="btn o" data-go="type">Scan Something Else</button></div>`},
hist:()=>`<div class="hd"><button class="ib" data-act="menu">${I('menu')}</button><h2>Scan History</h2><span class="ib"></span></div><div class="pad"><label class="fd" style="margin-top:0">${I('search')}<input id="hq" placeholder="Search scans…" value="${esc(S.q)}"><button type="button" class="lk" data-act="flt" style="padding:0">${I('sl')}</button></label><div class="tabs" style="margin-top:10px">${[['all','All'],['safe','Safe'],['risk','Flagged']].map(([k,l])=>`<button class="${S.f==k?'on':''}" data-act="setf" data-a="${k}">${l}</button>`).join('')}</div><div id="hl">${rowsH()}</div></div>${nav('hist')}`,
rep:id=>{const h=S.hist.find(x=>x.id==id);if(!h)return'<p>Not found</p>';S.scan=h;const L=LV[h.lvl];return`${hdr('Scan Report',1)}<div class="pad"><div class="c"><b>Scan Details</b>${[['Scan type',h.type],['Content',esc(h.val)],['Result',`<span class="bd ${L.c}">${L.t}</span>`],['Date',h.t.toLocaleDateString('en-US',{year:'numeric',month:'long',day:'numeric'})],['Time',h.t.toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'})]].map(([a,b])=>`<div class="cmp" style="grid-template-columns:90px 1fr"><span style="color:var(--mut)">${a}</span><span style="word-break:break-all">${b}</span></div>`).join('')}</div><div class="c" style="margin-top:12px"><b>Summary</b><small>${L.d} ${h.ind.length?'Indicators: '+h.ind.join('; ')+'.':''}</small></div><button class="btn" data-act="dl">${I('dl')} Download Report</button><button class="btn o" data-go="fnd" data-a="ov">View Detailed Findings</button><button class="btn o" data-act="rescan">Scan Again</button><button class="btn d" data-act="delscan" style="margin-top:10px">Delete This Scan</button></div>`},
kc:()=>`<div class="hd"><button class="ib" data-back style="visibility:hidden"></button><h2>Knowledge Center</h2><span class="ib"></span></div><div class="pad"><p style="color:var(--mut);margin:0 0 8px">Learn how to stay safe online.</p><label class="fd" style="margin-top:0">${I('search')}<input id="kq" placeholder="Search articles…" value="${esc(S.kq)}"></label><div id="kl" style="margin-top:12px">${kl()}</div></div>${nav('kc')}`,
art:i=>{const a=ART[i];return`${hdr('',1)}<div class="pad"><div class="big" style="width:96px;height:96px;margin:0 auto">${I(a.i)}</div><h1 style="font-size:26px;margin:16px 0 4px">${a.t}</h1><p style="color:var(--mut);margin:0 0 8px">${a.d}</p>${a.s.map(([h,p])=>`<div class="c" style="margin-bottom:10px"><b>${h}</b><p style="margin:6px 0 0;color:var(--mut);line-height:1.45;font-size:14px">${p}</p></div>`).join('')}<button class="btn" data-go="type">Scan Something Now</button></div>`},
prof:()=>`<div class="hd"><span class="ib"></span><h2>Profile</h2><span class="ib"></span></div><div class="pad"><div class="c row" style="margin-bottom:12px" data-go="acct"><div class="ic" style="border-radius:50%;width:54px;height:54px;background:#4a96ff;color:#fff">${I('user')}</div><div><b style="font-size:18px">${esc(S.user?S.user.name:'User')}</b><small>${esc(S.user?S.user.email:'user@veriguard.com')}</small></div>${I('edit')}</div><div class="c" style="padding:4px 14px">${[['sl','Account Settings','go'],['bell','Notifications','sw'],['lock','Privacy &amp; Security','pv'],['help','Help &amp; Support','hp'],['info','About VeriGuard','ab']].map(([i,t,k])=>`<div class="row" style="padding:13px 0;border-bottom:1px solid var(--ln)" data-act="${k=='go'?'acct':k=='sw'?'none':k}">${I(i)}<div><b style="font-weight:600">${t}</b></div>${k=='sw'?`<button class="sw ${S.notif?'on':''}" data-act="notifsw"></button>`:I('chev')}</div>`).join('')}</div><button class="btn o" data-act="logout">${I('out')} Log Out</button></div>${nav('prof')}`,
acct:()=>`${hdr('Account Settings',1)}<div class="pad"><b>Profile</b>${fd('an','user','Full Name','text',S.user?S.user.name:'User')}${fd('ae','mail','Email Address','email',S.user?S.user.email:'user@veriguard.com')}<button class="btn" data-act="saveprof" style="margin-top:12px">Save Changes</button><b style="display:block;margin-top:22px">Change Password</b>${fd('cp','lock','Current password','password')}${fd('np','lock','New password (8+ characters)','password')}${fd('np2','lock','Confirm new password','password')}<button class="btn o" data-act="savepw">Update Password</button><button class="btn d" data-act="delacct" style="margin:22px 0 30px">Delete Account</button></div>`};
const kl=()=>ART.map((a,i)=>({a,i})).filter(({a})=>(a.t+a.d).toLowerCase().includes(S.kq.toLowerCase())).map(({a,i})=>`<div class="c row" style="margin-bottom:10px" data-go="art" data-a="${i}"><div class="ic" style="width:56px;height:56px">${I(a.i)}</div><div><b>${a.t}</b><small>${a.d}</small></div>${I('chev')}</div>`).join('')||'<p style="text-align:center;color:var(--mut)">No articles found.</p>';
const H={splash:()=>{S.tm.push(setTimeout(()=>go('ob','0'),2600))},
ana:()=>{[0,1,2].forEach(i=>S.tm.push(setTimeout(()=>{const t=$('#st'+i+' .t');if(t)t.style.background='#2fae6c'},900*(i+1))));S.tm.push(setTimeout(()=>{if(S.save)S.hist.unshift(S.scan);repl('res')},3100))},
file:()=>{$('#ff').onchange=e=>{const f=e.target.files[0];if(!f)return;S.file=f.name;$('#fn').textContent=f.name+' ('+Math.max(1,Math.round(f.size/1024))+' KB)';$('#fs').disabled=false}},
qr:()=>{$('#qf').onchange=async e=>{const f=e.target.files[0];if(!f)return;let v=null;try{if(window.BarcodeDetector){const r=await new BarcodeDetector({formats:['qr_code']}).detect(await createImageBitmap(f));if(r[0])v=r[0].rawValue}}catch(x){}if(!v){toast('Couldn’t decode here, using a sample code');v=QS[S.qi++%QS.length]}startScan('QR Code Scan',v)}}};
const QS=['https://menu.example.com/table-4','http://secure-login.verify-account.xyz/update','https://bit.ly/sample','https://example.com/events'];
const A={none:()=>{},close:()=>{$('#sheet').className=''},eye:b=>{const i=b.parentNode.querySelector('input');i.type=i.type=='password'?'text':'password'},
login:()=>{const e=gv('em'),p=$('#pw').value;let ok=er('em',!e?'Enter your email':!em(e)?'Enter a valid email':'');ok=er('pw',!p?'Enter your password':S.user&&S.user.email==e.toLowerCase()&&S.user.pw!=p?'Incorrect password':'')&&ok;if(!ok)return;if(!S.user)S.user={name:'User',email:e.toLowerCase(),pw:p};toast('Welcome back');root('dash')},
signup:()=>{const n=gv('fn'),e=gv('em'),p=$('#pw').value,q=$('#pw2').value;let ok=er('fn',n.length<2?'Enter your full name':'');ok=er('em',!em(e)?'Enter a valid email':'')&&ok;ok=er('pw',p.length<8?'Use at least 8 characters':'')&&ok;ok=er('pw2',p!=q?'Passwords don’t match':'')&&ok;if(!ok)return;S.user={name:n,email:e.toLowerCase(),pw:p};toast('Account created');root('dash')},
forgot:()=>{const e=gv('em');if(!er('em',!em(e)?'Enter a valid email':''))return;$('#fm').innerHTML=`<div class="ok">If an account exists for ${esc(e)}, a reset link has been sent. (Prototype: no email is actually sent.)</div>`},
scanurl:()=>{const u=gv('u');if(!u||!/^(https?:\/\/)?[^\s.]+\.[^\s]{2,}$/i.test(u)){toast('Enter a valid website link');return}startScan('URL Scan',/^https?:/i.test(u)?u:'https://'+u)},ex:()=>{$('#u').value='https://bit.ly/sample'},
scanfile:()=>startScan('File Scan',S.file),samplefile:()=>startScan('File Scan','urgent-bank-verify-phish.png'),
simqr:()=>startScan('QR Code Scan',QS[S.qi++%QS.length]),tick:b=>{const t=b.querySelector('span'),on=t.dataset.on!='1';t.dataset.on=on?'1':'0';t.style.background=on?'#2fae6c':'#c3d3ee';b.querySelector('b').style.textDecoration=on?'line-through':''},
setf:(b,k)=>{S.f=k;draw()},flt:()=>{S.f=S.f=='all'?'safe':S.f=='safe'?'risk':'all';draw()},
dl:()=>{const h=S.scan,t=`VeriGuard Scan Report\nType: ${h.type}\nContent: ${h.val}\nResult: ${LV[h.lvl].t}\nDate: ${fmt(h.t)}\nIndicators: ${h.ind.join('; ')||'none'}\n(Demo assessment, not a guarantee of safety)`;try{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([t],{type:'text/plain'}));a.download='veriguard-report.txt';a.click()}catch(e){}toast('Report downloaded (demo)')},
rescan:()=>startScan(S.scan.type,S.scan.val),delscan:()=>{S.hist=S.hist.filter(x=>x.id!=S.scan.id);toast('Scan deleted');back()},
menu:()=>sheet(`<h3>Menu</h3>${[['home','Home','dash'],['clock','Scan History','hist'],['book','Knowledge Center','kc'],['user','Profile','prof']].map(([i,t,r])=>`<div class="row" style="padding:12px 0" data-root="${r}">${I(i)}<div><b>${t}</b></div></div>`).join('')}`),
notifs:()=>sheet(`<h3>Notifications</h3>${S.notif?['Welcome to VeriGuard. Run your first scan from Home.','Tip: Always preview a QR code’s address before opening it.',S.hist[0]?`Last scan: ${LV[S.hist[0].lvl].t}`:''].filter(Boolean).map(x=>`<div class="c" style="margin-bottom:8px;font-size:14px">${esc(x)}</div>`).join(''):'<p>Notifications are turned off in Profile.</p>'}`),
notifsw:b=>{S.notif=!S.notif;b.classList.toggle('on',S.notif);toast(S.notif?'Notifications on':'Notifications off')},
pv:()=>sheet(`<h3>Privacy &amp; Security</h3><div class="row nc" style="padding:10px 0"><div><b>Save scan history</b><small>Keep scans so you can revisit them.</small></div><button class="sw ${S.save?'on':''}" data-act="savesw"></button></div><button class="btn o" data-act="clr">Clear scan history</button>`),
savesw:b=>{S.save=!S.save;b.classList.toggle('on',S.save)},clr:()=>{S.hist=[];A.close();toast('History cleared')},
hp:()=>sheet(`<h3>Help &amp; Support</h3>${[['How do I scan a link?','Home → Scan URL, paste the link and tap Scan.'],['Is a Safe result a guarantee?','No. It only means no warning signs were found.'],['Need more help?','Email support@veriguard.example (demo address).']].map(([q,a])=>`<div class="c" style="margin-bottom:8px"><b>${q}</b><small>${a}</small></div>`).join('')}`),
ab:()=>sheet(`<h3>About VeriGuard</h3><p style="color:var(--mut)">VeriGuard helps you check links, QR codes and messages before you interact with them, and explains why. Prototype v1.0. Detection, camera decoding and accounts are simulated.</p>`),
saveprof:()=>{const n=gv('an'),e=gv('ae');let ok=er('an',n.length<2?'Enter your name':'');ok=er('ae',!em(e)?'Enter a valid email':'')&&ok;if(!ok)return;S.user=Object.assign(S.user||{pw:''},{name:n,email:e.toLowerCase()});toast('Profile updated')},
savepw:()=>{const c=$('#cp').value,n=$('#np').value,m=$('#np2').value;let ok=er('cp',S.user&&S.user.pw&&c!=S.user.pw?'Current password is incorrect':!c?'Enter your current password':'');ok=er('np',n.length<8?'Use at least 8 characters':'')&&ok;ok=er('np2',n!=m?'Passwords don’t match':'')&&ok;if(!ok)return;S.user=Object.assign(S.user||{name:'User',email:'user@veriguard.com'},{pw:n});toast('Password updated')},
delacct:()=>sheet(`<h3>Delete account?</h3><p style="color:var(--mut)">This removes your account and scan history. This can’t be undone.</p><button class="btn d" data-act="delok">Yes, delete my account</button><button class="btn o" data-act="close">Cancel</button>`),
